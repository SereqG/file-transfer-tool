name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.body != '@claude APPROVED') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # DISCOVERY / PLANNING phase only. Claude must not implement here —
          # implementation happens in claude-implement.yml, triggered only by
          # an exact "@claude APPROVED" comment from a maintainer.
          prompt: |
            You are in the discovery / planning phase of this conversation.
            You are NOT implementing anything right now.

            Before you respond:
            1. Read the full conversation so far for this issue or pull
               request — the original body AND every comment in the thread
               (e.g. `gh issue view <number> --comments` or
               `gh pr view <number> --comments`). Do not rely on only the
               single comment or event that triggered this run.
            2. Read CLAUDE.md if it exists.
            3. Explore the relevant parts of the repository to understand
               current behavior, architecture, and conventions.

            Then, respond with a single comment that:
            - Summarizes your understanding of what's being asked.
            - Asks clarifying questions if anything is ambiguous,
              underspecified, or conflicts with the existing codebase.
            - Proposes a concrete implementation plan: which files/areas
              you'd touch, the approach, and any tradeoffs or open
              questions — enough detail for a maintainer to approve or
              redirect it.

            Do NOT write, edit, or delete any files. Do NOT run git commit,
            git push, or create branches/PRs. This run has no ability to
            implement — your only output is the discussion comment above.

            Once a maintainer is happy with the plan, they will approve it
            by commenting exactly:

              @claude APPROVED

            That triggers a separate, privileged workflow that implements
            the approved plan. Do not implement preemptively, and do not
            ask the user to approve in any other wording.

          # Hard-block implementation tools so Claude can't act on the plan
          # even if a prompt-injection or ambiguous request tries to push it
          # that direction — discussion mode is enforced here, not just asked
          # for. See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # bypassPermissions auto-approves everything (reads, gh/git
          # read commands, etc.) without prompting — required in headless
          # CI where there's no one to answer a permission prompt. Deny
          # rules are still enforced under bypassPermissions, so the
          # disallowedTools below still block real implementation.
          claude_args: |
            --permission-mode bypassPermissions
            --disallowedTools "Edit" "Write" "NotebookEdit" "Bash(git commit:*)" "Bash(git push:*)" "Bash(gh pr create:*)" "Bash(gh pr merge:*)"
            --max-turns 25

